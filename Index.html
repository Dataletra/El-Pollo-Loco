<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>El Pollo Loco</title>
		<link rel="stylesheet" href="style.css" />
		<script type="module" src="./scripts/game.js"></script>
	</head>
	<body>
		<h1>El Pollo Loco</h1>

		<div class="game-container">
			<button id="mute-btn" class="mute-button" onclick="toggleMuteGame()">mute</button>
			<div class="controls-overlay">
				<div class="dpad">
					<button id="up" class="btn">▲</button>
					<div class="dpad-row">
						<button id="left" class="btn">◄</button>
						<button id="right" class="btn">►</button>
					</div>
				</div>
				<button id="attack" class="btn action-btn">A</button>
			</div>
			<canvas id="canvas" width="720" height="480"></canvas>
			<div id="start-screen" class="start-container">
				<img
					class="start-screen-img"
					src="./assets/img/Intro_Outro_scenes/startscreen_1_tutorial.png"
					alt="Start Screen"
				/>
				<button id="start-btn" class="start-button" onclick="startGame()">Start Game</button>
			</div>
			<div id="win-screen" class="start-container">
				<img class="start-screen-img" src="./assets/img/Intro_Outro_scenes/You Win A.png" alt="Start Screen" />
				<button id="start-btn" class="start-button" onclick="startGame()">Start Game</button>
			</div>
			<div id="lose-screen" class="start-container">
				<img class="start-screen-img" src="./assets/img/Intro_Outro_scenes/game_over.png" alt="Start Screen" />
				<button id="start-btn" class="start-button" onclick="startGame()">Start Game</button>
			</div>
		</div>
	</body>
</html>
